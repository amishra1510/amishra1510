name: Profile Contribution Graph

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/profile-cards.yml'

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render contribution graph
        uses: seijikohara/profile-cards-action@v0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: amishra1510
          cards: lifetime
          output-dir: assets
          themes: light,dark
          commit: true
          commit-message: 'chore(profile): refresh contribution graph [skip ci]'
