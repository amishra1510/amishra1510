name: Update GitHub Streak

on:
  schedule:
    - cron: "0 3 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak SVG from GitHub GraphQL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from datetime import date, timedelta
          from pathlib import Path

          query = '''query($login:String!){user(login:$login){contributionsCollection{contributionCalendar{totalContributions weeks{contributionDays{date contributionCount}}}}}}'''
          payload = json.dumps({'query': query, 'variables': {'login': os.environ['GH_USER']}})
          result = subprocess.run([
              'curl','-sS','-H',f"Authorization: bearer {os.environ['GH_TOKEN']}",
              '-H','Content-Type: application/json','-d',payload,
              'https://api.github.com/graphql'
          ], capture_output=True, text=True, check=True)
          data = json.loads(result.stdout)
          if 'errors' in data:
              raise SystemExit(json.dumps(data['errors']))

          days = [d for w in data['data']['user']['contributionsCollection']['contributionCalendar']['weeks'] for d in w['contributionDays']]
          counts = {d['date']: d['contributionCount'] for d in days}
          total = data['data']['user']['contributionsCollection']['contributionCalendar']['totalContributions']

          def streaks():
              ordered = sorted(counts)
              longest = current = 0
              run = 0
              for day in ordered:
                  if counts[day] > 0:
                      run += 1
                      longest = max(longest, run)
                  else:
                      run = 0
              today = max(ordered)
              cursor = date.fromisoformat(today)
              while counts.get(cursor.isoformat(), 0) > 0:
                  current += 1
                  cursor -= timedelta(days=1)
              if current == 0:
                  cursor = date.fromisoformat(today) - timedelta(days=1)
                  while counts.get(cursor.isoformat(), 0) > 0:
                      current += 1
                      cursor -= timedelta(days=1)
              return current, longest

          current, longest = streaks()

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
          <rect width="495" height="195" rx="10" fill="#0d1117"/>
          <rect x="1" y="1" width="493" height="193" rx="9" fill="none" stroke="#30363d"/>
          <text x="247.5" y="34" text-anchor="middle" fill="#58a6ff" font-family="Arial,sans-serif" font-size="16" font-weight="700">GitHub Streak</text>
          <line x1="24" y1="48" x2="471" y2="48" stroke="#30363d"/>
          <text x="95" y="92" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">{current}</text>
          <text x="95" y="116" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Current Streak</text>
          <text x="247.5" y="92" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">{longest}</text>
          <text x="247.5" y="116" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Longest Streak</text>
          <text x="400" y="92" text-anchor="middle" fill="#f0f6fc" font-family="Arial,sans-serif" font-size="30" font-weight="700">{total}</text>
          <text x="400" y="116" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="13">Total Contributions</text>
          <line x1="24" y1="137" x2="471" y2="137" stroke="#30363d"/>
          <text x="247.5" y="163" text-anchor="middle" fill="#8b949e" font-family="Arial,sans-serif" font-size="11">Updated automatically by GitHub Actions</text>
          </svg>'''

          Path('profile').mkdir(exist_ok=True)
          Path('profile/streak.svg').write_text(svg, encoding='utf-8')
          print(f'Generated streak: current={current}, longest={longest}, total={total}')
          PY

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update GitHub streak" || exit 0
          git push
